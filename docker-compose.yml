# Sobe o Radar inteiro: banco, carga dos dados, API e painel. Um comando só.
#   docker compose up -d
# O painel abre em http://localhost:3000 e a API responde em http://localhost:8000.
# A chave de acesso é a de RADAR_CHAVES, e ela nunca chega ao navegador.
services:
  banco:
    image: postgres:16
    environment:
      POSTGRES_DB: radar_goias
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "${RADAR_PORTA:-5433}:5432"
    volumes:
      - dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d radar_goias"]
      interval: 5s
      retries: 20

  api:
    build: .
    environment:
      RADAR_BANCO_URL: postgresql://postgres@banco:5432/radar_goias
      RADAR_CHAVES: ${RADAR_CHAVES:-demo}
    ports:
      - "${RADAR_PORTA_API:-8000}:8000"
    depends_on:
      banco:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/saude')
      interval: 5s
      retries: 40

  painel:
    build: ./web
    environment:
      RADAR_API_URL: http://api:8000
      RADAR_CHAVE: ${RADAR_CHAVES:-demo}
    ports:
      - "${RADAR_PORTA_PAINEL:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  dados:
