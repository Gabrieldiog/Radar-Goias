# Sobe o Radar inteiro: banco, carga dos dados e API. Um comando só.
#   docker compose up -d
# A API fica em http://localhost:8000 e a chave de acesso é a de RADAR_CHAVES.
services:
  banco:
    image: postgres:16
    environment:
      POSTGRES_DB: radar_goias
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "${RADAR_PORTA:-5433}:5432"
    volumes:
      - dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d radar_goias"]
      interval: 5s
      retries: 20

  api:
    build: .
    environment:
      RADAR_BANCO_URL: postgresql://postgres@banco:5432/radar_goias
      RADAR_CHAVES: ${RADAR_CHAVES:-demo}
    ports:
      - "${RADAR_PORTA_API:-8000}:8000"
    depends_on:
      banco:
        condition: service_healthy

volumes:
  dados:
