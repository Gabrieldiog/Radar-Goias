[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radar-goias"
version = "0.1.0"
description = "Indicadores públicos de Goiás cruzando fontes que não conversam entre si"
requires-python = ">=3.12"
dependencies = [
    "certifi>=2024.0",
    "fastapi>=0.115",
    "httpx>=0.28",
    "openpyxl>=3.1",
    "psycopg[binary]>=3.2",
    "slowapi>=0.1.9",
    "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["testes"]

[tool.setuptools.packages.find]
include = ["radar*"]

[tool.setuptools.package-data]
"radar.dados" = ["*.json", "*.pem"]
