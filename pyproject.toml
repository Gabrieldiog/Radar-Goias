[project]
name = "radar-goias"
version = "0.1.0"
description = "Indicadores públicos de Goiás cruzando fontes que não conversam entre si"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["testes"]

[tool.setuptools.package-data]
"radar.dados" = ["*.json"]
